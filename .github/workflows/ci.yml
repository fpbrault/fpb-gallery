name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # These identify the public, read-only dataset and are safe to keep in source.
  NEXT_PUBLIC_SANITY_PROJECT_ID: h7cwop0i
  NEXT_PUBLIC_SANITY_DATASET: production
  NEXT_PUBLIC_SANITY_API_VERSION: 2026-07-01
  NEXT_PUBLIC_SANITY_USE_CDN: "true"
  NEXT_PUBLIC_SITE_URL: https://fpbrault.com
  SANITY_API_READ_TOKEN: ${{ secrets.CI_SANITY_API_READ_TOKEN }}
  SANITY_WEBHOOK_SECRET: ci-not-used-for-live-requests

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Restore Next.js build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - run: npm ci

      # Keep critical production vulnerabilities as a hard gate.
      - name: Audit production dependencies (critical)
        run: npm audit --omit=dev --audit-level=critical

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

      # Sanity currently brings high-severity advisories through its CLI/workbench
      # dependency chain without a non-breaking npm audit fix. Keep them visible
      # without preventing the application quality checks above from running.
      - name: Report high-severity production advisories
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: ignore

  sanity-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sanity:validate
      - run: npm run sanity:schema
      - run: npm run sanity:typegen
      - name: Upload generated Sanity contracts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generated-sanity-contracts
          path: |
            schema.json
            src/sanity/sanity.types.ts
      - name: Verify generated Sanity contracts are committed
        run: git diff --exit-code -- schema.json src/sanity/sanity.types.ts

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
